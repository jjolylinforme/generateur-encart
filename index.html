<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Générateur d'encart pliable</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 680px; margin: 40px auto; padding: 20px; background: #f4f6f9; color: #333; }
        .card { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.06); }
        h2 { margin-top: 0; color: #0d346d; font-size: 22px; }
        p.subtitle { color: #666; font-size: 14px; margin-bottom: 25px; }
        label { display: block; font-weight: 600; margin: 18px 0 6px; font-size: 14px; color: #222; }
        select, input, textarea.input-code { width: 100%; padding: 10px 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; box-sizing: border-box; font-family: inherit; }
        textarea.input-code { height: 110px; font-family: monospace; font-size: 12px; resize: vertical; }
        .row { display: flex; gap: 15px; }
        .row > div { flex: 1; }
        .hidden { display: none !important; }
        button.btn-generate { margin-top: 25px; background: #0d346d; color: white; border: none; padding: 14px 20px; border-radius: 6px; font-size: 15px; cursor: pointer; width: 100%; font-weight: 600; }
        button.btn-generate:hover { background: #0a2850; }
        .success { background: #d1e7dd; color: #0f5132; padding: 12px; border-radius: 6px; font-weight: 500; display: none; margin-top: 15px; text-align: center; font-size: 14px; }
        textarea.output-code { width: 100%; height: 100px; margin-top: 15px; font-family: monospace; font-size: 12px; padding: 10px; border-radius: 6px; border: 1px solid #ddd; background: #f8f9fa; color: #555; box-sizing: border-box; }
    </style>
</head>
<body>

<div class="card">
    <h2>Créer un encart pliable</h2>
    <p class="subtitle">Choisissez le type de contenu, renseignez les informations et copiez le code généré.</p>

    <div class="row">
        <div>
            <label for="typeSelect">1. Type de contenu</label>
            <!-- MODIFIEZ OU AJOUTEZ VOS OPTIONS ICI -->
            <select id="typeSelect" onchange="mettreAJourChamps()">
                <option value="podcast" data-emoji="🎧" data-titre="Écouter l'article" data-hauteur="140">🎧 Podcast</option>
                <option value="html" data-emoji="📊" data-titre="Consulter le tableau" data-hauteur="650" selected>📊 Tableau</option>
                <option value="html" data-emoji="📈" data-titre="Voir le graphique" data-hauteur="500">📈 Graphique</option>
                <option value="html" data-emoji="📄" data-titre="Lire le document" data-hauteur="700">📄 Document</option>
                <option value="html" data-emoji="🗺️" data-titre="Explorer la carte" data-hauteur="550">🗺️ Carte</option>
            </select>
        </div>
        <div>
            <label for="customTitle">Texte du bouton (modifiable)</label>
            <input type="text" id="customTitle" value="Consulter le tableau">
        </div>
    </div>

    <!-- ZONE PODCAST -->
    <div id="zonePodcast" class="hidden">
        <label for="podcastId">2. Numéro du player podcast (ID Saooti)</label>
        <input type="text" id="podcastId" placeholder="Ex : 3123821">
    </div>

    <!-- ZONE CODE HTML -->
    <div id="zoneHtml">
        <label for="embedCode">2. Collez le code HTML à intégrer (&lt;iframe...&gt;)</label>
        <textarea class="input-code" id="embedCode" placeholder='<iframe src="https://..." width="100%" height="600"></iframe>'></textarea>
    </div>

    <div class="row">
        <div id="blocHauteur">
            <label for="hauteurInput">3. Hauteur ordinateur (px)</label>
            <input type="number" id="hauteurInput" value="650">
        </div>
        <div>
            <label for="sourceUrl" id="labelSource">4. Lien en bas (optionnel)</label>
            <input type="text" id="sourceUrl" placeholder="https://...">
        </div>
    </div>

    <button type="button" class="btn-generate" onclick="genererEtCopier()">Générer et copier le code</button>
    <div class="success" id="msgSuccess">✅ Code copié ! Vous pouvez le coller dans votre article.</div>

    <textarea class="output-code" id="resultat" readonly placeholder="Le code généré apparaîtra ici..."></textarea>
</div>

<script>
function mettreAJourChamps() {
    var select = document.getElementById('typeSelect');
    var opt = select.options[select.selectedIndex];
    var type = opt.value;

    document.getElementById('customTitle').value = opt.getAttribute('data-titre');
    document.getElementById('hauteurInput').value = opt.getAttribute('data-hauteur');

    if (type === 'podcast') {
        document.getElementById('zonePodcast').classList.remove('hidden');
        document.getElementById('zoneHtml').classList.add('hidden');
        document.getElementById('blocHauteur').classList.add('hidden');
        document.getElementById('labelSource').textContent = "3. Lien en bas du lecteur";
        document.getElementById('sourceUrl').value = "https://l.linforme.com/podcast";
    } else {
        document.getElementById('zonePodcast').classList.add('hidden');
        document.getElementById('zoneHtml').classList.remove('hidden');
        document.getElementById('blocHauteur').classList.remove('hidden');
        document.getElementById('labelSource').textContent = "4. Lien source en bas (optionnel)";
        document.getElementById('sourceUrl').value = "";
    }
}

function genererEtCopier() {
    var select = document.getElementById('typeSelect');
    var opt = select.options[select.selectedIndex];
    var type = opt.value;
    var emoji = opt.getAttribute('data-emoji');
    var titre = document.getElementById('customTitle').value.trim() || opt.getAttribute('data-titre');
    var hauteur = parseInt(document.getElementById('hauteurInput').value, 10) || 600;
    var sourceUrl = document.getElementById('sourceUrl').value.trim();
    var cleanEmbed = "";
    var texteLien = "Ouvrir en plein écran dans un nouvel onglet ↗";

    if (type === 'podcast') {
        var podId = document.getElementById('podcastId').value.trim();
        if (!podId) {
            alert("Veuillez saisir le numéro du player podcast (ex: 3123821).");
            return;
        }
        texteLien = "Découvrez comment écouter tous nos Audios";
        cleanEmbed = '<iframe src="https://playerbeta.octopus.saooti.com/miniplayer/large/' + podId + '?distributorId=c7ab55a4-10b5-4099-a0bc-3e96362afe9a&color=0d346d&theme=ffffff&article=false&wave=false" width="100%" height="140px" scrolling="no" style="border:none; display:block;" allow="clipboard-read; clipboard-write; autoplay"></iframe>';
    } else {
        var rawEmbed = document.getElementById('embedCode').value.trim();
        if (!rawEmbed) {
            alert("Veuillez coller un code HTML dans la case n°2.");
            return;
        }

        if (!sourceUrl && rawEmbed.indexOf('documentcloud.org') !== -1) {
            var match = rawEmbed.match(/src="([^"]+)"/);
            if (match) {
                sourceUrl = match[1].replace('embed.documentcloud.org', 'www.documentcloud.org').replace('/?embed=1', '/');
            }
        }

        cleanEmbed = rawEmbed;
        if (cleanEmbed.indexOf('<iframe') === 0) {
            cleanEmbed = cleanEmbed
                .replace(/\swidth="[^"]*"/gi, '')
                .replace(/\sheight="[^"]*"/gi, '')
                .replace(/\sstyle="[^"]*"/gi, '')
                .replace('<iframe', '<iframe class="encart-iframe"');
        }
    }

    var uid = 'encart_' + Math.floor(Math.random() * 1000000);
    var titreEchappe = titre.replace(/'/g, "\\'").replace(/"/g, '&quot;');
    var texteFermer = (type === 'podcast') ? 'Masquer le lecteur' : 'Masquer';

    var mobileHelperHTML = (sourceUrl && type !== 'podcast')
        ? '<div class="encart-mobile-bar"><span>📱 Affichage réduit sur mobile</span><a href="' + sourceUrl + '" target="_blank" rel="noopener">Agrandir ↗</a></div>'
        : '';

    var footerHTML = sourceUrl
        ? '<div class="encart-footer"><a href="' + sourceUrl + '" target="_blank" rel="noopener">' + texteLien + '</a></div>'
        : '';

    var mobileHeightCSS = (type === 'podcast')
        ? ''
        : '@media (max-width: 640px) { #' + uid + ' .encart-wrapper.show { max-height: 85vh; } #' + uid + ' .encart-iframe { height: 70vh !important; } #' + uid + ' .encart-mobile-bar { display: flex; } }';

    var codeFinal = '<!-- DÉBUT ENCART PLIABLE -->\n' +
        '<style>\n' +
        '#' + uid + ' { border: 1px solid #e0e0e0; border-radius: 8px; overflow: hidden; background: #f8f9fa; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 16px 0; }\n' +
        '#' + uid + ' .toggle-btn { width: 100%; padding: 10px 12px; background: #0d346d; color: white; border: none; cursor: pointer; font-size: 14px; font-weight: 500; text-align: left; transition: background 0.2s; display: flex; align-items: center; gap: 8px; }\n' +
        '#' + uid + ' .toggle-btn:hover { background: #0a2850; }\n' +
        '#' + uid + ' .toggle-btn.active { border-bottom: 1px solid #e0e0e0; }\n' +
        '#' + uid + ' .encart-wrapper { max-height: 0; overflow: hidden; transition: max-height 0.35s ease; background: white; visibility: hidden; }\n' +
        '#' + uid + ' .encart-wrapper.show { max-height: ' + (hauteur + 180) + 'px; visibility: visible; }\n' +
        '#' + uid + ' .encart-content { pointer-events: none; overflow-x: auto; -webkit-overflow-scrolling: touch; }\n' +
        '#' + uid + ' .encart-wrapper.show .encart-content { pointer-events: auto; }\n' +
        '#' + uid + ' .encart-iframe { width: 100%; height: ' + hauteur + 'px; border: none; display: block; }\n' +
        '#' + uid + ' .encart-mobile-bar { display: none; justify-content: space-between; align-items: center; padding: 8px 12px; background: #eef3f9; border-bottom: 1px solid #d0dceb; font-size: 12px; color: #0d346d; }\n' +
        '#' + uid + ' .encart-mobile-bar a { background: #0d346d; color: white; padding: 4px 10px; border-radius: 4px; text-decoration: none; font-weight: 600; font-size: 12px; }\n' +
        '#' + uid + ' .encart-footer { padding: 12px 20px; font-size: 13px; color: #333; border-top: 1px solid #e0e0e0; background: #f8f9fa; }\n' +
        '#' + uid + ' .encart-footer a { color: #0d346d; font-weight: 500; text-decoration: none; }\n' +
        '#' + uid + ' .encart-footer a:hover { text-decoration: underline; }\n' +
        mobileHeightCSS + '\n' +
        '</style>\n' +
        '<div id="' + uid + '">\n' +
        '    <button class="toggle-btn" onclick="var w = this.nextElementSibling; var open = w.classList.toggle(\'show\'); this.classList.toggle(\'active\', open); this.querySelector(\'.txt\').textContent = open ? \'' + texteFermer + '\' : \'' + titreEchappe + '\';">\n' +
        '        <span>' + emoji + '</span>\n' +
        '        <span class="txt">' + titre + '</span>\n' +
        '    </button>\n' +
        '    <div class="encart-wrapper">\n' +
        '        ' + mobileHelperHTML + '\n' +
        '        <div class="encart-content">' + cleanEmbed + '</div>\n' +
        '        ' + footerHTML + '\n' +
        '    </div>\n' +
        '</div>\n' +
        '<!-- FIN ENCART PLIABLE -->';

    var textarea = document.getElementById('resultat');
    textarea.value = codeFinal;
    textarea.select();

    if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(codeFinal);
    } else {
        document.execCommand('copy');
    }

    var msg = document.getElementById('msgSuccess');
    msg.style.display = 'block';
    setTimeout(function() { msg.style.display = 'none'; }, 4000);
}
</script>

</body>
</html>
