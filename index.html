<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Générateur d'encart pliable</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 680px;
            margin: 40px auto;
            padding: 20px;
            background: #f4f6f9;
            color: #333;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
        }
        h2 {
            margin-top: 0;
            color: #0d346d;
            font-size: 22px;
        }
        p.subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 25px;
        }
        label {
            display: block;
            font-weight: 600;
            margin: 18px 0 6px;
            font-size: 14px;
            color: #222;
        }
        select, input, textarea.input-code {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
            font-family: inherit;
        }
        textarea.input-code {
            height: 110px;
            font-family: monospace;
            font-size: 12px;
            resize: vertical;
        }
        .row {
            display: flex;
            gap: 15px;
        }
        .row > div {
            flex: 1;
        }
        .hidden {
            display: none !important;
        }
        button.btn-generate {
            margin-top: 25px;
            background: #0d346d;
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
            width: 100%;
            font-weight: 600;
            transition: background 0.2s;
        }
        button.btn-generate:hover {
            background: #0a2850;
        }
        .success {
            background: #d1e7dd;
            color: #0f5132;
            padding: 12px;
            border-radius: 6px;
            font-weight: 500;
            display: none;
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
        }
        textarea.output-code {
            width: 100%;
            height: 100px;
            margin-top: 15px;
            font-family: monospace;
            font-size: 12px;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #ddd;
            background: #f8f9fa;
            color: #555;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Créer un encart pliable</h2>
    <p class="subtitle">Choisissez le type de contenu, renseignez les informations demandées et copiez le code généré.</p>

    <div class="row">
        <div>
            <label for="typeSelect">1. Type de contenu</label>
            <select id="typeSelect" onchange="mettreAJourChamps()"></select>
        </div>
        <div>
            <label for="customTitle">Texte du bouton (modifiable)</label>
            <input type="text" id="customTitle">
        </div>
    </div>

    <!-- ZONE SPÉCIFIQUE PODCAST -->
    <div id="zonePodcast" class="hidden">
        <label for="podcastId">2. Numéro du player podcast (ID Saooti)</label>
        <input type="text" id="podcastId" placeholder="Ex : 3123821">
    </div>

    <!-- ZONE CLASSIQUE (IFRAME / CODE HTML) -->
    <div id="zoneHtml">
        <label for="embedCode">2. Collez le code HTML à intégrer (&lt;iframe...&gt; ou script)</label>
        <textarea class="input-code" id="embedCode" placeholder='<iframe src="https://..." width="100%" height="600"></iframe>'></textarea>
    </div>

    <div class="row">
        <div id="blocHauteur">
            <label for="hauteurInput">3. Hauteur ordinateur (en pixels)</label>
            <input type="number" id="hauteurInput" value="650">
        </div>
        <div>
            <label for="sourceUrl" id="labelSource">4. Lien en bas (optionnel)</label>
            <input type="text" id="sourceUrl" placeholder="https://... (laisser vide pour masquer)">
        </div>
    </div>

    <button class="btn-generate" onclick="genererEtCopier()">Générer et copier le code</button>
    <div class="success" id="msgSuccess">✅ Code copié dans le presse-papier ! Il ne reste plus qu'à le coller dans l'article.</div>

    <textarea class="output-code" id="resultat" readonly placeholder="Le code généré apparaîtra ici..."></textarea>
</div>

<script>
    // =========================================================================
    // CONFIGURATION : Ajoutez, modifiez ou supprimez vos options ici facilement
    // =========================================================================
    const OPTIONS_DISPONIBLES = [
        { type: "podcast", emoji: "🎧", label: "Écouter l'article", hauteur: 140, lienDefaut: "https://l.linforme.com/podcast", texteLien: "Découvrez comment écouter tous nos Audios" },
        { type: "html",    emoji: "📊", label: "Consulter le tableau", hauteur: 650 },
        { type: "html",    emoji: "📈", label: "Voir le graphique", hauteur: 500 },
        { type: "html",    emoji: "📄", label: "Lire le document", hauteur: 700 },
        { type: "html",    emoji: "🗺️", label: "Explorer la carte", hauteur: 550 }
    ];
    // =========================================================================

    const selectEl = document.getElementById('typeSelect');
    const titleInput = document.getElementById('customTitle');
    const hauteurInput = document.getElementById('hauteurInput');
    const sourceUrlInput = document.getElementById('sourceUrl');
    const zonePodcast = document.getElementById('zonePodcast');
    const zoneHtml = document.getElementById('zoneHtml');
    const blocHauteur = document.getElementById('blocHauteur');
    const labelSource = document.getElementById('labelSource');

    // Remplissage automatique du menu déroulant au chargement
    OPTIONS_DISPONIBLES.forEach((opt, index) => {
        const option = document.createElement('option');
        option.value = index;
        option.textContent = `${opt.emoji} ${opt.label}`;
        selectEl.appendChild(option);
    });

    // Adapte l'interface selon le choix (Podcast vs Code HTML)
    function mettreAJourChamps() {
        const choix = OPTIONS_DISPONIBLES[selectEl.value];
        titleInput.value = choix.label;
        hauteurInput.value = choix.hauteur;

        if (choix.type === 'podcast') {
            zonePodcast.classList.remove('hidden');
            zoneHtml.classList.add('hidden');
            blocHauteur.classList.add('hidden');
            labelSource.textContent = "3. Lien en bas du lecteur";
            sourceUrlInput.value = choix.lienDefaut || "";
        } else {
            zonePodcast.classList.add('hidden');
            zoneHtml.classList.remove('hidden');
            blocHauteur.classList.remove('hidden');
            labelSource.textContent = "4. Lien source en bas (optionnel)";
            sourceUrlInput.value = "";
        }
    }

    mettreAJourChamps();

    function genererEtCopier() {
        const choix = OPTIONS_DISPONIBLES[selectEl.value];
        const emoji = choix.emoji;
        const titre = titleInput.value.trim() || choix.label;
        const hauteur = parseInt(hauteurInput.value) || 600;
        let sourceUrl = sourceUrlInput.value.trim();
        let texteLien = choix.texteLien || "Ouvrir en plein écran dans un nouvel onglet ↗";
        let cleanEmbed = "";

        // CAS 1 : PODCAST
        if (choix.type === 'podcast') {
            const podId = document.getElementById('podcastId').value.trim();
            if (!podId) {
                alert("⚠️ Veuillez saisir le numéro du player podcast (ex: 3123821).");
                return;
            }
            cleanEmbed = `<iframe src="https://playerbeta.octopus.saooti.com/miniplayer/large/${podId}?distributorId=c7ab55a4-10b5-4099-a0bc-3e96362afe9a&color=0d346d&theme=ffffff&article=false&wave=false" width="100%" height="140px" scrolling="no" style="border:none; display:block;" allow="clipboard-read; clipboard-write; autoplay"></iframe>`;
        } 
        // CAS 2 : CONTENU HTML / IFRAME LIBRE
        else {
            const rawEmbed = document.getElementById('embedCode').value.trim();
            if (!rawEmbed) {
                alert("⚠️ Veuillez coller un code HTML dans la case n°2.");
                return;
            }

            // Détection automatique du lien DocumentCloud si laissé vide
            if (!sourceUrl && rawEmbed.includes('documentcloud.org')) {
                const match = rawEmbed.match(/src="([^"]+)"/);
                if (match) {
                    sourceUrl = match[1]
                        .replace('embed.documentcloud.org', 'www.documentcloud.org')
                        .replace('/?embed=1', '/');
                }
            }

            cleanEmbed = rawEmbed;
            if (cleanEmbed.startsWith('<iframe')) {
                // On retire les dimensions fixes pour laisser le CSS responsive gérer Desktop & Mobile
                cleanEmbed = cleanEmbed
                    .replace(/\swidth="[^"]*"/gi, '')
                    .replace(/\sheight="[^"]*"/gi, '')
                    .replace(/\sstyle="[^"]*"/gi, '')
                    .replace('<iframe', `<iframe class="encart-iframe"`);
            }
        }

        // Bandeau d'aide spécifique au mobile si un lien source existe (pour les tableaux/docs)
        const mobileHelperHTML = (sourceUrl && choix.type !== 'podcast')
            ? `<div class="encart-mobile-bar"><span>📱 Affichage réduit sur mobile</span><a href="${sourceUrl}" target="_blank" rel="noopener">Agrandir ↗</a></div>`
            : '';

        // Pied de page classique
        const footerHTML = sourceUrl 
            ? `<div class="encart-footer"><a href="${sourceUrl}" target="_blank" rel="noopener">${texteLien}</a></div>` 
            : '';

        // Règles CSS responsive : sur mobile, on limite la hauteur à 75% de l'écran (sauf pour le podcast)
        const mobileHeightCSS = choix.type === 'podcast'
            ? ''
            : `@media (max-width: 640px) {
                #${uid} .encart-wrapper.show { max-height: 85vh; }
                #${uid} .encart-iframe { height: 70vh !important; }
                #${uid} .encart-mobile-bar { display: flex; }
               }`;

        const uid = 'encart_' + Math.floor(Math.random() * 1000000);
        const titreEchappe = titre.replace(/'/g, "\\'").replace(/"/g, '&quot;');
        const texteFermer = choix.type === 'podcast' ? 'Masquer le lecteur' : 'Masquer';

        const codeFinal = `<!-- DÉBUT ENCART PLIABLE -->
<style>
    #${uid} { border: 1px solid #e0e0e0; border-radius: 8px; overflow: hidden; background: #f8f9fa; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 16px 0; }
    #${uid} .toggle-btn { width: 100%; padding: 10px 12px; background: #0d346d; color: white; border: none; cursor: pointer; font-size: 14px; font-weight: 500; text-align: left; transition: background 0.2s; display: flex; align-items: center; gap: 8px; }
    #${uid} .toggle-btn:hover { background: #0a2850; }
    #${uid} .toggle-btn.active { border-bottom: 1px solid #e0e0e0; }
    #${uid} .encart-wrapper { max-height: 0; overflow: hidden; transition: max-height 0.35s ease; background: white; visibility: hidden; }
    #${uid} .encart-wrapper.show { max-height: ${hauteur + 180}px; visibility: visible; }
    #${uid} .encart-content { pointer-events: none; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    #${uid} .encart-wrapper.show .encart-content { pointer-events: auto; }
    #${uid} .encart-iframe { width: 100%; height: ${hauteur}px; border: none; display: block; }
    #${uid} .encart-mobile-bar { display: none; justify-content: space-between; align-items: center; padding: 8px 12px; background: #eef3f9; border-bottom: 1px solid #d0dceb; font-size: 12px; color: #0d346d; }
    #${uid} .encart-mobile-bar a { background: #0d346d; color: white; padding: 4px 10px; border-radius: 4px; text-decoration: none; font-weight: 600; font-size: 12px; }
    #${uid} .encart-footer { padding: 12px 20px; font-size: 13px; color: #333; border-top: 1px solid #e0e0e0; background: #f8f9fa; }
    #${uid} .encart-footer a { color: #0d346d; font-weight: 500; text-decoration: none; }
    #${uid} .encart-footer a:hover { text-decoration: underline; }
    ${mobileHeightCSS}
</style>
<div id="${uid}">
    <button class="toggle-btn" onclick="const w = this.nextElementSibling; const open = w.classList.toggle('show'); this.classList.toggle('active', open); this.querySelector('.txt').textContent = open ? '${texteFermer}' : '${titreEchappe}';">
        <span>${emoji}</span>
        <span class="txt">${titre}</span>
    </button>
    <div class="encart-wrapper">
        ${mobileHelperHTML}
        <div class="encart-content">${cleanEmbed}</div>
        ${footerHTML}
    </div>
</div>
<!-- FIN ENCART PLIABLE -->`;

        const textarea = document.getElementById('resultat');
        textarea.value = codeFinal;
        textarea.select();
        navigator.clipboard.writeText(codeFinal);

        const msg = document.getElementById('msgSuccess');
        msg.style.display = 'block';
        setTimeout(() => msg.style.display = 'none', 4000);
    }
</script>

</body>
</html>
